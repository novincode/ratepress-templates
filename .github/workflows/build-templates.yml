name: Build Templates Manifest

on:
  push:
    branches: [ main ]
    paths:
      - 'templates/**/config.php'
      - 'build-templates.php'
  pull_request:
    branches: [ main ]
    paths:
      - 'templates/**/config.php'
      - 'build-templates.php'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.TEMPLATES_BUILD_TOKEN || secrets.GITHUB_TOKEN }}

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'

    - name: Build templates.json
      run: php build-templates.php

    - name: Check for changes
      id: verify-changed-files
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "changed=false" >> $GITHUB_OUTPUT
        fi

    - name: Commit and push changes
      if: steps.verify-changed-files.outputs.changed == 'true' && github.event_name == 'push'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add templates.json
        git commit -m "🔄 Update templates.json [automated]" || echo "No changes to commit"
        git push

    - name: Comment on PR
      if: steps.verify-changed-files.outputs.changed == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '🤖 **Template Manifest Updated**\n\nThe `templates.json` has been automatically regenerated from the template `config.php` files. The updated file is ready to be committed.'
          })