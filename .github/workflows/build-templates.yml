name: Build Templates Manifest

on:
  push:
    branches: [ main ]
    paths:
      - 'templates/**/config.php'
      - 'templates/**/preview.png'
      - 'build-templates.php'
  pull_request:
    branches: [ main ]
    paths:
      - 'templates/**/config.php'
      - 'templates/**/preview.png'
      - 'build-templates.php'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.TEMPLATES_BUILD_TOKEN || secrets.GITHUB_TOKEN }}

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'

    - name: Setup Node.js (only if needed)
      id: check-previews
      run: |
        # Check if any templates are missing preview.png
        missing_previews=0
        for dir in templates/*/*; do
          if [ -d "$dir" ] && [ ! -f "$dir/preview.png" ]; then
            missing_previews=1
            break
          fi
        done
        echo "needs_node=$missing_previews" >> $GITHUB_OUTPUT

    - name: Setup Node.js
      if: steps.check-previews.outputs.needs_node == '1'
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Build templates.json
      run: php build-templates.php

    - name: Check for changes
      id: verify-changed-files
      run: |
        if [ -n "$(git status --porcelain)" ]; then
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "changed=false" >> $GITHUB_OUTPUT
        fi

    - name: Commit and push changes
      if: steps.verify-changed-files.outputs.changed == 'true' && github.event_name == 'push'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add templates.json templates/**/preview.png
        git commit -m "🔄 Update templates.json and previews [automated]" || echo "No changes to commit"
        git push

    - name: Comment on PR
      if: steps.verify-changed-files.outputs.changed == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '🤖 **Template Manifest Updated**\n\nThe `templates.json` has been automatically regenerated from the template `config.php` files. Preview images have been generated where needed. The updated files are ready to be committed.'
          })